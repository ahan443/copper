<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copper TV - Local Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* --- RESET & VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { --bg-dark: #0b0212; --primary-pink: #d90b7e; --text-white: #ffffff; --text-gray: #b3b3b3; }
        body { background-color: var(--bg-dark); color: var(--text-white); }
        a { text-decoration: none; color: inherit; }
        
        /* --- NAVBAR --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 70px; background-color: #1a052b; border-bottom: 1px solid #2a1040; position: sticky; top: 0; z-index: 100; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: white; display: flex; align-items: center; gap: 5px; }
        .logo i { color: var(--primary-pink); }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .sign-in-btn { background-color: var(--primary-pink); color: white; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
        .logout-btn { background-color: #333; color: white; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; display: none; }

        /* --- LAYOUT --- */
        .page-header { text-align: center; padding: 30px 0; background: linear-gradient(180deg, #1a052b 0%, var(--bg-dark) 100%); }
        .page-header h1 { font-size: 32px; font-weight: 400; letter-spacing: 1px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px 40px; }
        .category-section { margin-bottom: 40px; }
        .category-title { font-size: 18px; margin-bottom: 20px; font-weight: 500; text-transform: capitalize; }
        
        /* --- CHANNEL GRID --- */
        .channel-grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .channel-item { position: relative; width: 90px; height: 90px; cursor: pointer; transition: transform 0.2s; }
        .channel-item:hover { transform: scale(1.1); }
        .channel-circle { width: 100%; height: 100%; border-radius: 50%; background-color: white; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid transparent; }
        .channel-circle img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .premium-badge { position: absolute; top: -5px; right: 0; background-color: var(--primary-pink); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; border: 2px solid var(--bg-dark); z-index: 10; }

        /* --- ADMIN PANEL --- */
        #admin-panel { display: none; background: #1a0f2e; padding: 20px; margin-bottom: 30px; border-radius: 10px; border: 1px solid #d90b7e; }
        .admin-form { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
        input, select { padding: 10px; background: #0b0212; border: 1px solid #333; color: white; border-radius: 5px; width: 100%; }
        .btn-add { background: var(--primary-pink); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-download { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        
        /* --- MODALS --- */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .login-box { background: #1a052b; padding: 40px; border-radius: 10px; width: 350px; text-align: center; border: 1px solid var(--primary-pink); }
        .player-box { width: 90%; max-width: 800px; background: #000; position: relative; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: black; }
        .video-container iframe, .video-container video { width: 100% !important; height: 100% !important; border: none; }
        .player-header { padding: 10px; background: #1a052b; display: flex; justify-content: space-between; }
        .close-modal { cursor: pointer; font-size: 24px; }
        
        .admin-table-container { max-height: 250px; overflow-y: auto; margin-top: 20px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        
        @media (max-width: 768px) {
            .admin-form { grid-template-columns: 1fr; }
            .navbar { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="logo"><i class="fa-solid fa-play"></i> Copper TV</a>
        </div>
        <div class="nav-right">
            <button class="sign-in-btn" id="nav-login-btn">Admin Login</button>
            <button class="logout-btn" id="nav-logout-btn">Logout</button>
        </div>
    </nav>

    <header class="page-header"><h1>Live TV</h1></header>

    <main class="container">
        <!-- Admin Dashboard -->
        <div id="admin-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Admin Dashboard</h3>
                <button class="btn-download" onclick="downloadJSON()">Save & Download channels.json</button>
            </div>
            <p style="font-size: 11px; color: #aaa; margin-bottom: 15px;">Note: After downloading, replace your local channels.json file with the new one.</p>
            
            <form id="channel-form" class="admin-form">
                <input type="hidden" id="edit-index" value="-1">
                <div><label>Name</label><input type="text" id="ch-name" required></div>
                <div>
                    <label>Category</label>
                    <select id="ch-category">
                        <option value="bangladeshi">Bangladeshi</option>
                        <option value="sports">Sports</option>
                        <option value="news">News</option>
                        <option value="movies">Movies</option>
                        <option value="kids">Kids</option>
                        <option value="music">Music</option>
                    </select>
                </div>
                <div><label>Icon URL</label><input type="text" id="ch-image" required></div>
                <div><label>Stream Link</label><input type="text" id="ch-link" required></div>
                <div>
                    <label>Type</label>
                    <select id="ch-type">
                        <option value="m3u8">M3U8</option>
                        <option value="embed">Embed</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px; align-items: center;">
                    <label style="font-size:12px;"><input type="checkbox" id="ch-premium"> Pro</label>
                    <button type="submit" class="btn-add" id="submit-btn">Add</button>
                </div>
            </form>

            <div class="admin-table-container">
                <table>
                    <thead><tr><th>Img</th><th>Name</th><th>Category</th><th>Actions</th></tr></thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="main-content"></div>
    </main>

    <!-- Modals -->
    <div id="login-modal" class="modal-overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p style="font-size:12px; margin-bottom:10px;">Default: admin / 1234</p>
            <input type="text" id="login-user" placeholder="Username" style="margin-bottom:10px;">
            <input type="password" id="login-pass" placeholder="Password" style="margin-bottom:15px;">
            <button class="btn-add" style="width:100%" onclick="attemptLogin()">Login</button>
            <button onclick="document.getElementById('login-modal').style.display='none'" style="background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div id="player-modal" class="modal-overlay">
        <div class="player-box">
            <div class="player-header">
                <h3 id="player-title">Live TV</h3>
                <span class="close-modal" onclick="closePlayer()">&times;</span>
            </div>
            <div class="video-container" id="video-wrapper"></div>
        </div>
    </div>

    <script>
        let channels = [];
        let currentHls = null;

        const categories = [
            { id: 'bangladeshi', title: 'বাংলাদেশি চ্যানেল' },
            { id: 'sports', title: 'Sports Channels' },
            { id: 'news', title: 'News Channels' },
            { id: 'movies', title: 'Movie Channels' },
            { id: 'kids', title: 'Kids Channels' },
            { id: 'music', title: 'Music Channels' }
        ];

        // 1. LOAD DATA FROM JSON FILE
        async function loadChannels() {
            try {
                const response = await fetch('channels.json');
                channels = await response.json();
                renderUI();
            } catch (err) {
                console.error("Could not load channels.json. Using empty list.", err);
                renderUI();
            }
        }

        function renderUI() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            
            // Build Categories
            categories.forEach(cat => {
                const filtered = channels.filter(c => c.category === cat.id && c.isActive !== false);
                if (filtered.length === 0) return;

                const section = document.createElement('section');
                section.className = 'category-section';
                section.innerHTML = `<h2 class="category-title">${cat.title}</h2><div class="channel-grid" id="grid-${cat.id}"></div>`;
                mainContent.appendChild(section);

                const grid = document.getElementById(`grid-${cat.id}`);
                filtered.forEach(ch => {
                    const idx = channels.indexOf(ch);
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerHTML = `
                        ${ch.isPremium ? '<div class="premium-badge"><i class="fa-solid fa-crown"></i></div>' : ''}
                        <div class="channel-circle"><img src="${ch.imageUrl}"></div>
                    `;
                    div.onclick = () => openPlayer(idx);
                    grid.appendChild(div);
                });
            });

            // Update Admin Table
            const tbody = document.getElementById('admin-tbody');
            tbody.innerHTML = '';
            channels.forEach((ch, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${ch.imageUrl}" width="30"></td>
                        <td>${ch.name}</td>
                        <td>${ch.category}</td>
                        <td>
                            <button onclick="editChannel(${index})" style="color:orange; background:none; border:none; cursor:pointer;">Edit</button>
                            <button onclick="deleteChannel(${index})" style="color:red; background:none; border:none; cursor:pointer; margin-left:10px;">Del</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 2. PLAYER LOGIC
        function openPlayer(index) {
            const ch = channels[index];
            document.getElementById('player-modal').style.display = 'flex';
            document.getElementById('player-title').innerText = ch.name;
            const wrapper = document.getElementById('video-wrapper');
            wrapper.innerHTML = '';

            if (ch.streamType === 'embed') {
                wrapper.innerHTML = ch.streamUrl.includes('<iframe') ? ch.streamUrl : `<iframe src="${ch.streamUrl}" allowfullscreen></iframe>`;
            } else {
                const video = document.createElement('video');
                video.controls = true; video.autoplay = true;
                wrapper.appendChild(video);
                if (Hls.isSupported()) {
                    currentHls = new Hls();
                    currentHls.loadSource(ch.streamUrl);
                    currentHls.attachMedia(video);
                } else {
                    video.src = ch.streamUrl;
                }
            }
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('video-wrapper').innerHTML = '';
            if(currentHls) currentHls.destroy();
        }

        // 3. ADMIN ACTIONS
        document.getElementById('channel-form').onsubmit = (e) => {
            e.preventDefault();
            const index = parseInt(document.getElementById('edit-index').value);
            const data = {
                name: document.getElementById('ch-name').value,
                category: document.getElementById('ch-category').value,
                imageUrl: document.getElementById('ch-image').value,
                streamUrl: document.getElementById('ch-link').value,
                streamType: document.getElementById('ch-type').value,
                isPremium: document.getElementById('ch-premium').checked,
                isActive: true
            };

            if (index === -1) channels.push(data);
            else channels[index] = data;

            document.getElementById('channel-form').reset();
            document.getElementById('edit-index').value = "-1";
            document.getElementById('submit-btn').innerText = "Add";
            renderUI();
        };

        window.deleteChannel = (index) => {
            if(confirm("Delete?")) { channels.splice(index, 1); renderUI(); }
        };

        window.editChannel = (index) => {
            const ch = channels[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('ch-name').value = ch.name;
            document.getElementById('ch-category').value = ch.category;
            document.getElementById('ch-image').value = ch.imageUrl;
            document.getElementById('ch-link').value = ch.streamUrl;
            document.getElementById('ch-type').value = ch.streamType;
            document.getElementById('ch-premium').checked = ch.isPremium;
            document.getElementById('submit-btn').innerText = "Update";
        };

        // 4. SAVE (DOWNLOAD)
        window.downloadJSON = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(channels, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "channels.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        // 5. LOGIN LOGIC
        document.getElementById('nav-login-btn').onclick = () => document.getElementById('login-modal').style.display = 'flex';
        window.attemptLogin = () => {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(u === 'admin' && p === '1234') {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('nav-login-btn').style.display = 'none';
                document.getElementById('nav-logout-btn').style.display = 'block';
            } else { alert("Wrong credentials"); }
        };
        document.getElementById('nav-logout-btn').onclick = () => location.reload();

        // Initial Load
        loadChannels();
    </script>
</body>
</html>
